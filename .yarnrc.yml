yarnPath: .yarn/releases/yarn-3.1.1.cjs
nodeLinker: "node-modules"

unsafeHttpWhitelist:
  - localhost

npmRegistries:
  "https://eventdex-291364234808.d.codeartifact.us-east-1.amazonaws.com/npm/eventdex/":
    npmAlwaysAuth: true
    # A reference, never a literal — this file is tracked. CodeArtifact tokens
    # are minted from an AWS identity and last at most 12 h, so installing needs
    # one in the environment:
    #
    #   export CODEARTIFACT_AUTH_TOKEN="$(aws codeartifact get-authorization-token \
    #       --domain eventdex --query authorizationToken --output text)"
    #
    # The `:-` default keeps installs of public packages working when it is
    # absent — only @eventdex fetches fail.
    npmAuthToken: "${CODEARTIFACT_AUTH_TOKEN:-}"
npmScopes:
  eventdex:
    npmRegistryServer: "https://eventdex-291364234808.d.codeartifact.us-east-1.amazonaws.com/npm/eventdex/"
